format: sidecar.workflow/v1
id: agentkit.integrity
version: 1.0.0
description: Check Agent Kit V2 declared file hashes and skill mirrors without executing repository code. Not the full kit verification suite.
lifecycle: reviewed
review_ref: source-review:agent-sidecar-0.1.0/builtin-integrity
effects: [read_source, write_scratch]
replay_policy: safe_read_only
input_schema:
  type: object
  properties: {}
  additionalProperties: false
steps:
  - id: manifest
    executor: builtin
    operation: manifest
    needs: []
    criterion: All files declared by the Agent Kit V2 package manifest match their hashes.
    timeout_seconds: 30
  - id: mirrors
    executor: builtin
    operation: mirrors
    needs: []
    criterion: Canonical and Claude skill file sets and bytes are equal.
    timeout_seconds: 30
